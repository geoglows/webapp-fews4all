<!doctype html>
<html class="h-full" lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1" name="viewport"/>
  <title>FEWS4All</title>
</head>
<body class="h-full">
<div class="flex flex-col h-screen" id="app">

  <header class="flex items-center justify-between gap-4 h-[70px] px-4 bg-nav border-b border-sky-700/30 shrink-0" id="topbar">
    <div class="flex items-center gap-4 min-w-0">
      <a class="shrink-0" href="/index.html">
        <img alt="GEOGLOWS" class="h-8 w-auto" src="https://cdn.apps.geoglows.org/static/images/geoglows-logo-nav.webp"/>
      </a>
      <div class="min-w-0">
        <h1 class="text-black font-bold text-[32px] leading-tight">FEWS4All</h1>
        <p class="text-slate-800/80 text-xs truncate">Multi-Model Global Flood Early Warning System</p>
      </div>
    </div>

    <!-- The day being drawn. Filled by src/ui/header.js once the release loads;
         the dashes are what shows while it is still in flight. -->
    <div class="shrink-0 text-right min-w-0" id="release">
      <p class="text-slate-800/60 text-[10px] uppercase tracking-wider">Forecast release</p>
      <time class="block text-black font-semibold text-sm tabular-nums" id="release-date">—</time>
      <p class="text-[11px] truncate text-slate-800/70" id="release-note"></p>
    </div>
  </header>

  <main class="flex flex-1 min-h-0" id="main">
    <!-- The map and anything that floats over it. `relative` so the timeline can
         be positioned against the map area rather than the window, which keeps it
         clear of the side panel. -->
    <div class="flex-1 h-full relative">
      <!-- Placeholder tint behind the tiles; light, to match the default base map.
           Sized with w-full/h-full rather than absolute positioning: MapLibre
           measures this element when it initialises, and a map that comes up with
           no height renders a blank canvas with no error anywhere. -->
      <div class="w-full h-full bg-slate-200" id="map"></div>

      <!-- The retrospective timeline. Empty until a release index loads; an older
           deployment without releases.json simply never fills it. -->
      <div class="absolute left-0 right-0 bottom-0 z-10 pointer-events-none" id="timeline"></div>
    </div>

    <aside class="shrink-0 w-[360px] h-full overflow-y-auto bg-panel border-l border-slate-200 p-4 flex flex-col" id="panel">
      <div class="flex-1 flex flex-col items-center text-center text-slate-500 mt-10" id="panel-empty">
        <!-- heroicons 24/outline `cursor-arrow-rays`, inline because a static
             page can't import from the bundle; the rest come from src/icons.js. -->
        <svg aria-hidden="true" class="text-4xl text-sky-500 mb-3" fill="none" height="1em"
             stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24" width="1em"
             xmlns="http://www.w3.org/2000/svg">
          <path d="M15.042 21.672 13.684 16.6m0 0-2.51 2.225.569-9.47 5.227 7.917-3.286-.672ZM12 2.25V4.5m5.834.166-1.591 1.591M20.25 10.5H18M7.757 14.743l-1.59 1.59M6 10.5H3.75m4.007-4.243-1.59-1.59" stroke-linecap="round"
                stroke-linejoin="round"/>
        </svg>
        <!-- Wording is replaced by main.js once the dataset's `kind` is known. -->
        <h2 class="text-slate-800 font-semibold text-[15px] mb-1">Loading…</h2>
        <p class="text-sm leading-relaxed max-w-[240px]">Fetching the latest flood forecasts.</p>
      </div>

      <div class="flex-1" hidden id="panel-content"></div>
    </aside>
  </main>
</div>

<script src="/src/main.js" type="module"></script>
</body>
</html>
